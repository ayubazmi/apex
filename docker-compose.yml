services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env add}
      POSTGRES_DB: ${POSTGRES_DB:-apex}
    volumes:
      - pgdata:/var/lib/postgresql/data   # persistent storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex} -d ${POSTGRES_DB:-apex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: ${APP_IMAGE:-apex-ops-api}:${APP_VERSION:-1.0.0}   # versioned image (for rollback)
    environment:
      APP_ENV: ${APP_ENV:-staging}          # Dockerfile  "production" override
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-apex}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   
    restart: unless-stopped

volumes:
  pgdata:
