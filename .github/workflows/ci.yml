name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      demo_fail:
        description: "Intentional failure demo (test fail karwao)"
        type: boolean
        default: false

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Run tests
        env:
          DEMO_FAIL: ${{ inputs.demo_fail }}
        run: pytest -v

  build:
    name: Build and scan image
    needs: test                      # test fail = build chalega hi nahi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: apex-ops-api:${{ env.APP_VERSION }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (image vulnerabilities)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: apex-ops-api:${{ env.APP_VERSION }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test (container sach mein chal raha hai?)
        run: |
          docker run -d --name smoke -p 8000:8000 apex-ops-api:${APP_VERSION}
          for i in $(seq 1 15); do
            if curl -fs localhost:8000/ready; then echo; echo "READY"; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

  deploy:
    name: Publish versioned image
    needs: build                     # build fail = deploy blocked
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.APP_VERSION }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
    cd:
    name: Deploy to Kali VM
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: self-hosted
    concurrency:
      group: deploy-kali
      cancel-in-progress: false
    steps:
      - name: Fix .deploy ownership
        working-directory: /root/apex
        run: |
          mkdir -p .deploy
          sudo chown -R "$(id -u):$(id -g)" .deploy
          chmod -R u+rwX .deploy

      - name: Remember current version
        working-directory: /root/apex
        run: echo "PREV_VERSION=$(cat .deploy/current 2>/dev/null || true)" >> "$GITHUB_ENV"

      - name: Deploy new version
        working-directory: /root/apex
        run: bash scripts/deploy.sh "$APP_VERSION"

      - name: Verify running version
        run: curl -fs localhost:8000/health | grep -q "\"version\":\"$APP_VERSION\""

      - name: Auto-rollback on failure
        if: failure()
        working-directory: /root/apex
        run: |
          if [ -n "$PREV_VERSION" ]; then
            bash scripts/rollback.sh "$PREV_VERSION"
          else
            echo "Koi purana version nahi, rollback skip"
          fi
