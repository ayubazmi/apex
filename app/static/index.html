<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef5; --panel:#ffffff; --ink:#14233a; --muted:#5d6b82; --line:#d5dde9;
  --brand:#0f3d5e; --brand2:#1b6a8f;
  --low:#6f8fa8; --medium:#2f8f6b; --high:#e08a1e; --critical:#c8372d;
  --radius:14px;
}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 48px}

/* Hero: live status board */
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:36px 0 64px}
.hero .wrap{padding-bottom:0}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.02em}
.hero p{opacity:.85;max-width:52ch;margin-top:6px}
.board{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
  padding:8px 14px;border-radius:999px;font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:#9fb3c8}
.dot.up{background:#5ff0a8;box-shadow:0 0 0 0 rgba(95,240,168,.7);animation:pulse 2s infinite}
.dot.down{background:#ff7a70}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(95,240,168,0)}100%{box-shadow:0 0 0 0 rgba(95,240,168,0)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:-40px}
.stat{background:var(--panel);border-radius:var(--radius);padding:16px 18px;border:1px solid var(--line)}
.stat b{display:block;font-family:'Bricolage Grotesque';font-size:2rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}
.stat.crit{border-left:5px solid var(--critical)}

.grid{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-top:22px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card h2{font-size:1.2rem;margin-bottom:14px}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font:inherit;background:#f8fafc;color:var(--ink)}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #8cc4e6;outline-offset:1px}
textarea{resize:vertical;min-height:72px}
.btn{margin-top:16px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--brand);color:#fff;
  font:600 1rem Figtree;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--brand2)}
.err{color:var(--critical);font-size:.85rem;margin-top:8px;min-height:1.2em}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:#f3f6fa;padding:6px 14px;border-radius:999px;
  font:500 .85rem Figtree;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

.ticket{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:14px 14px 14px 18px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:12px;border-left:6px solid var(--low);background:#fbfcfe}
.ticket.p-medium{border-left-color:var(--medium)}
.ticket.p-high{border-left-color:var(--high)}
.ticket.p-critical{border-left-color:var(--critical)}
.ticket.resolved{opacity:.6}
.ticket.resolved h3{text-decoration:line-through}
.ticket h3{font-size:1.02rem;font-weight:700}
.ticket p{color:var(--muted);font-size:.9rem;grid-column:1/2}
.meta{font-size:.8rem;color:var(--muted)}
.actions{display:flex;gap:6px;align-items:center;grid-row:1/3;grid-column:2}
.actions select{width:auto;padding:6px 8px;font-size:.85rem}
.del{border:1px solid var(--line);background:#fff;color:var(--critical);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem}
.del:hover{background:#fdeceb}
.empty{text-align:center;color:var(--muted);padding:32px 10px}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.85rem}
@media(prefers-reduced-motion:reduce){.dot.up{animation:none}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <h1>Apex Operations</h1>
  <p>Incidents aur ops tasks ek jagah. Service ki sehat neeche live dikhti hai.</p>
  <div class="board">
    <div class="chip"><i class="dot" id="dApi"></i><span id="tApi">API checking…</span></div>
    <div class="chip"><i class="dot" id="dDb"></i><span id="tDb">Database checking…</span></div>
    <div class="chip" id="tVer">version –</div>
  </div>
</div></header>

<main class="wrap">
  <section class="stats" id="stats"></section>

  <div class="grid">
    <form class="card" id="form">
      <h2>New ticket</h2>
      <label for="title">Title</label>
      <input id="title" placeholder="e.g. Nginx returning 502" maxlength="120" required>
      <label for="desc">Details</label>
      <textarea id="desc" placeholder="Kya hua, kab se, kahan?"></textarea>
      <label for="prio">Priority</label>
      <select id="prio">
        <option value="low">Low</option><option value="medium" selected>Medium</option>
        <option value="high">High</option><option value="critical">Critical</option>
      </select>
      <button class="btn" type="submit">Create ticket</button>
      <div class="err" id="err" role="alert"></div>
    </form>

    <section class="card">
      <h2>Tickets</h2>
      <div class="filters" id="filters"></div>
      <div id="list"></div>
    </section>
  </div>
  <footer>Apex Operations API · interactive docs at <a href="/docs">/docs</a></footer>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tickets = [], filter = 'all';
const STATUS = {open:'Open', in_progress:'In progress', resolved:'Resolved'};

async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.detail?.[0]?.msg || e.detail || 'Request failed'); }
  return r.status === 204 ? null : r.json();
}

async function health(){
  try{
    const h = await api('/health');
    $('dApi').className='dot up'; $('tApi').textContent='API running · up '+h.uptime_seconds+'s';
    $('tVer').textContent='v'+h.version+' · '+h.env;
  }catch{ $('dApi').className='dot down'; $('tApi').textContent='API unreachable'; }
  try{
    await api('/ready'); $('dDb').className='dot up'; $('tDb').textContent='Database connected';
  }catch{ $('dDb').className='dot down'; $('tDb').textContent='Database down'; }
}

async function load(){
  tickets = await api('/api/tickets');
  const s = await api('/api/stats');
  const st = s.by_status||{}, pr = s.by_priority||{};
  $('stats').innerHTML = `
    <div class="stat"><b>${s.total}</b><span>Total tickets</span></div>
    <div class="stat"><b>${st.open||0}</b><span>Open</span></div>
    <div class="stat"><b>${st.in_progress||0}</b><span>In progress</span></div>
    <div class="stat crit"><b>${pr.critical||0}</b><span>Critical</span></div>`;
  render();
}

function render(){
  $('filters').innerHTML = ['all','open','in_progress','resolved'].map(f =>
    `<button class="${f===filter?'on':''}" data-f="${f}">${f==='all'?'All':STATUS[f]}</button>`).join('');
  const rows = tickets.filter(t => filter==='all' || t.status===filter);
  $('list').innerHTML = rows.length ? rows.map(t => `
    <article class="ticket p-${t.priority} ${t.status}">
      <h3>${esc(t.title)}</h3>
      <div class="actions">
        <select data-id="${t.id}" aria-label="Status">
          ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===t.status?'selected':''}>${v}</option>`).join('')}
        </select>
        <button class="del" data-del="${t.id}">Delete</button>
      </div>
      ${t.description?`<p>${esc(t.description)}</p>`:''}
      <div class="meta">#${t.id} · ${t.priority} priority · ${new Date(t.created_at+'Z').toLocaleString()}</div>
    </article>`).join('')
    : '<div class="empty">Koi ticket nahi. Left side form se pehla ticket banao.</div>';
}

$('filters').onclick = e => { if(e.target.dataset.f){ filter=e.target.dataset.f; render(); } };
$('list').onchange = async e => {
  if(e.target.dataset.id){ await api('/api/tickets/'+e.target.dataset.id,{method:'PATCH',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({status:e.target.value})}); load(); }
};
$('list').onclick = async e => {
  if(e.target.dataset.del){ await api('/api/tickets/'+e.target.dataset.del,{method:'DELETE'}); load(); }
};
$('form').onsubmit = async e => {
  e.preventDefault(); $('err').textContent='';
  try{
    await api('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:$('title').value.trim(),description:$('desc').value.trim(),priority:$('prio').value})});
    $('form').reset(); load();
  }catch(er){ $('err').textContent = er.message; }
};

health(); load(); setInterval(health, 10000);
</script>
</body>
</html>
